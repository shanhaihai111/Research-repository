name: Weekly Psychiatry Frontiers
on:
  schedule:
    - cron: '30 0 * * 1' # Monday 08:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      send_report:
        description: "Send this manually started report by email"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: weekly-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install only report dependencies
        run: pip install reportlab pyyaml fonttools
      - name: Verify route and report safeguards
        run: |
          python tests/test_routes.py
          python tests/test_email_delivery.py
          python tests/test_chinese_content.py
      - name: Build report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_REPORT_USD: ${{ vars.LLM_MAX_REPORT_USD }}
          LLM_INPUT_USD_PER_MILLION: ${{ vars.LLM_INPUT_USD_PER_MILLION }}
          LLM_OUTPUT_USD_PER_MILLION: ${{ vars.LLM_OUTPUT_USD_PER_MILLION }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.send_report }}" = "true" ]; }; then
            if [ -z "$SMTP_PASSWORD" ] || [ -z "$REPORT_RECIPIENT" ] || [ -z "$SMTP_HOST" ] || [ -z "$SMTP_PORT" ] || [ -z "$SMTP_USER" ]; then
              echo "SMTP configuration incomplete; refusing to send."
              exit 1
            fi
            mkdir -p config
            umask 077
            trap 'rm -f config/email.env' EXIT
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_FROM=%s\nSMTP_PASSWORD=%s\nREPORT_RECIPIENT=%s\n' "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_FROM" "$SMTP_PASSWORD" "$REPORT_RECIPIENT" > config/email.env
            python src/run_routes_weekly.py --send-email --confirm-send
          else
            python src/run_routes_weekly.py --no-email
          fi
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            reports/
            logs/
      - name: Commit archive
        run: |
          git config user.name "weekly-report-bot"
          git config user.email "actions@github.com"
          git add -f reports data/history.jsonl logs
          if [ -d data/chinese_cache ]; then git add -f data/chinese_cache || true; fi
          git diff --cached --quiet || git commit -m "archive weekly report"
          git push
      # Secrets are injected only into this job's temporary environment. They are
      # never committed, archived, printed, or written to the reports directory.
